<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAP ZAAP - Game</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Money Counter Box -->
        <div class="money-box" id="moneyBox">
            <span class="money-label">Total:</span>
            <span class="money-amount" id="moneyAmount">0</span>
        </div>
        
        <!-- Main Background Scene -->
        <main class="main-content">
            <!-- Money Popup Display (Hidden by default) -->
            <div class="money-popup" id="moneyPopup">
                <div class="money-popup-text">+<span id="moneyPopupAmount">0</span></div>
            </div>
            
            <!-- Customer Character -->
            <div class="customer" id="customer"></div>
            
            <!-- Chat Box -->
            <div class="chat-box" id="chatBox">
                <div class="chat-header-tab">Receive Order</div>
                <div class="chat-content">
                    <p>Hi! I'd like to order something...</p>
                </div>
                <button class="receive-order-btn">Receive Order</button>
            </div>
            
            <!-- Stall Front Image -->
            <div class="stall-front"></div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
